<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Thank You 💗</title>
<style>
body {
  margin: 0;
  height: 100vh;
  background: radial-gradient(#ffb6c1, #ff69b4);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Playfair Display', serif;
  overflow: hidden;
}

h1 {
  color: white;
  font-size: 3rem;
  text-align: center;
  z-index: 10;
  text-shadow: 0 0 15px rgba(255,255,255,0.6);
}

canvas {
  position: fixed;
  top: 0;
  left: 0;
}
</style>
</head>
<body>

<h1>Thank you for replying 💗<br>Your words mean a lot to me.</h1>
<canvas id="fireworks"></canvas>

<script>
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let fireworks = [];

function rand(min, max) {
  return Math.random() * (max - min) + min;
}

class Firework {
  constructor(x, y) {
    this.particles = [];
    for (let i = 0; i < 50; i++) {
      this.particles.push({
        x, y,
        vx: rand(-4,4),
        vy: rand(-4,4),
        alpha: 1
      });
    }
  }

  update() {
    this.particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.alpha -= 0.02;
    });
  }

  draw() {
    this.particles.forEach(p => {
      ctx.fillStyle = `rgba(255,255,255,${p.alpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
      ctx.fill();
    });
  }
}

function animate() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  fireworks.forEach(f => {
    f.update();
    f.draw();
  });
  fireworks = fireworks.filter(f => f.particles[0].alpha > 0);
  requestAnimationFrame(animate);
}

setInterval(() => {
  fireworks.push(new Firework(rand(100, canvas.width-100), rand(100, canvas.height-100)));
}, 700);

animate();
</script>

</body>
</html>
