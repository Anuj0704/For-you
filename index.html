<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You 💗</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="petals"></div>
    <div class="hearts"></div>

    <section class="hero">
      <h1 id="herName">Hey Rapunzel🌸</h1>
      <p>I made this because I wanted to say something properly.</p>
      
       <button onclick="startExperience(event)" class="start-btn"><span class="shimmer-text">Begin Reading 💗</span></button>
    </section>

    <section class="story reveal">
      <h2 class="type"></h2>

      <p id="typeText"></p>
      <p class="type"></p>
      <p class="type"></p>
      <p class="type"></p>
      <p class="type"></p>

    </section>

    

    <section class="final reveal">
      <h2 class="final-type"></h2>
      <p class="final-type"></p>
      <h1 class="final-type"></h1>
    </section>

    <footer class="reply reveal">
      <h2>If this resonated with you, I’d love to hear your thoughts </h2>
      <!-- <p>Message me 💗</p> -->
      <textarea id="msg" placeholder="I’d really love to know what you think💗..."></textarea>
      <button id="replyBtn" class="reply-btn" onclick="sendToWhatsApp()">Yayy! Tap here 💌 </button>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
